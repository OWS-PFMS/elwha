name: Publish Javadoc (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; a newer main push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build the javadoc
        # Same doclint ratchet as the jar build (#529): errors are fatal, so a page
        # only ever deploys from javadoc that passed the gate.
        run: mvn -B javadoc:javadoc --file pom.xml

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the apidocs site
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/reports/apidocs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
