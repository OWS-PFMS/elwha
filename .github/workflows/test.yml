name: Test

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test (components + Showcase)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install X server utilities (xset — not on all runner images)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends x11-xserver-utils

      - name: Run the suite
        # xvfb-run hosts the gui-tagged tier: on Linux the JDK 21 X11 font natives need a real
        # display, so the linux-gui-native Maven profile selects the native toolkit and Xvfb
        # provides the display (docs/research/elwha-test-suite-research.md §5b). The pinned
        # screen matches the Cacio config developers run against.
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" bash -c '
            for i in $(seq 1 15); do xset r off 2>/dev/null && break; sleep 1; done
            echo "--- xset q keyboard state ---"
            xset q | sed -n "/Keyboard Control/,+3p"
            if ! xset q | grep -Eq "auto repeat.+off"; then
              echo "FATAL - X autorepeat could not be disabled; failing fast instead of flaking"
              exit 1
            fi
            exec mvn -B verify --file pom.xml
          '

      - name: Upload test reports and crash dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/**
            hs_err_pid*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/**
          retention-days: 7
          if-no-files-found: warn

      - name: Summary
        if: success()
        run: |
          echo "### ✅ Suite green" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Both tiers passed (headless + gui-under-Xvfb). JaCoCo report attached as the \`jacoco-report\` artifact (report-only — no threshold gate while coverage grows; #438)." >> $GITHUB_STEP_SUMMARY
