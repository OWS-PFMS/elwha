name: Publish to GitHub Packages

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # write, not read: the final step creates the GitHub Release for the tag and uploads the
      # runnable -app jar as its asset (§5.3 of the artifact-split design). packages: write is
      # the deploy, unchanged.
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
          cache: maven

      - name: Verify tag matches pom.xml version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          # help:evaluate, not exec:exec — the reactor parent's pluginManagement skips the
          # exec plugin (the §1.5 exec:java wiring), which silences exec:exec here too and
          # would leave POM_VERSION empty.
          POM_VERSION=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout --non-recursive)
          if [ "$TAG_VERSION" != "$POM_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match pom.xml version ($POM_VERSION)"
            exit 1
          fi
          echo "Version match confirmed: $TAG_VERSION"

      - name: Verify CHANGELOG entry exists
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if ! grep -q "## \[${TAG_VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md does not have an entry for version ${TAG_VERSION}"
            exit 1
          fi
          echo "CHANGELOG entry found for ${TAG_VERSION}"

      - name: Build and publish
        # The suite runs in the required Test workflow, which already gated the tagged tree on
        # main. Re-running it here would need the Xvfb display scaffolding this workflow doesn't
        # have (the gui tier can't run headless-native) and would duplicate a passed gate — the
        # same dedupe reasoning as build.yml. This step's job is the artifacts: jar, sources,
        # javadoc, deployed to GitHub Packages.
        run: mvn -B clean deploy -DskipTests --file pom.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release and attach the runnable Showcase
        # Runs only after the Packages deploy succeeded, so a Release never exists without its
        # artifacts. `|| true` on create keeps a workflow re-run idempotent when the Release
        # already exists; --clobber makes the upload idempotent. Release-notes curation stays a
        # human act per the runbook — this step only guarantees the -app jar is attached.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          gh release create "$TAG" --verify-tag --title "$VERSION" \
            --notes "See CHANGELOG.md §[$VERSION]." || true
          gh release upload "$TAG" \
            "elwha-showcase/target/elwha-showcase-${VERSION}-app.jar" --clobber
