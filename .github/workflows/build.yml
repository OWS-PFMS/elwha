name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        # The suite runs in the dedicated Test workflow (test.yml), which is the required
        # test check. Running it here too doubled the gui-tier flake exposure and CI cost
        # for zero extra signal, so this workflow gates what is uniquely its own: compile,
        # jar, sources jar, and javadoc-jar assembly under doclint. No tests, no display.
        run: mvn -B clean package -DskipTests --file pom.xml
