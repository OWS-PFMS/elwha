name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        # xvfb-run hosts the gui-tagged test tier: on Linux the JDK 21 X11 font natives need a
        # real display (Cacio segfaults there — see docs/research/elwha-test-suite-research.md §5),
        # so the linux-gui-native Maven profile selects the native toolkit and Xvfb provides the
        # display. Preinstalled on ubuntu runner images. Headless Tier A is unaffected.
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" bash -c '
            for i in $(seq 1 15); do xset r off 2>/dev/null && break; sleep 1; done
            if ! xset q | grep -Eq "auto repeat.+off"; then
              echo "FATAL - X autorepeat could not be disabled; failing fast instead of flaking"
              exit 1
            fi
            exec mvn -B clean package --file pom.xml
          '

      - name: Upload test reports and crash dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-diagnostics
          path: |
            target/surefire-reports/**
            hs_err_pid*.log
            core*
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: elwha-jars
          path: |
            target/*.jar
            !target/original-*.jar
          retention-days: 7
